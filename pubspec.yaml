name: cotrainr
description: "Cotrainr — connect with independent fitness trainers and nutritionists."
publish_to: 'none'

# Android release version. Increment build number for every Play upload.
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Core dependencies
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1
  supabase_flutter: ^2.5.0
  flutter_riverpod: ^2.4.9
  go_router: ^13.0.0
  google_fonts: ^6.1.0
  image_picker: ^1.0.7
  crop_your_image: ^2.0.0
  permission_handler: ^11.1.0
  record: ^6.0.0
  just_audio: ^0.9.40
  health: ^13.3.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  http: ^1.2.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  flutter_svg: ^2.0.9
  fl_chart: ^0.66.0
  share_plus: ^7.2.1
  url_launcher: ^6.3.0
  file_picker: ^8.1.4
  app_links: ^6.3.2
  device_info_plus: ^12.3.0
  package_info_plus: ^8.0.0
  font_awesome_flutter: ^11.0.0
  shared_preferences: ^2.2.2
  timezone: ^0.10.0
  path: ^1.9.0
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/badges/
    - assets/branding/
    - assets/branding/icons/
    - assets/branding/references/
    - assets/branding/vector/
    - assets/branding/png/
    - assets/branding/png/color/
