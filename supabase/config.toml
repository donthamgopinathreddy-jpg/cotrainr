# Cotrainr Supabase local/project function config.
# Full project config may live in the hosted dashboard; this file documents
# function-specific deploy flags required for Login.

[functions.login-with-identifier]
# Unauthenticated entrypoint — password login before a session exists.
verify_jwt = false

[functions.google-oauth-callback]
# Google redirects the browser here without a Supabase Authorization header.
# Auth is enforced inside the function via OAuth state + PKCE (not gateway JWT).
verify_jwt = false

[functions.dispatch-video-session-reminders]
# Invoked by pg_cron / scheduled HTTP, not by signed-in Flutter clients.
verify_jwt = false
